baseURL = 'https://example.org/'
languageCode = 'en-us'
title = 'My Portfolio'
theme = 'portfolio'

[params]
  tagline = 'Personal site & blog'
  description = 'A personal portfolio and blog'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[menu]

  [[menu.main]]
    name = 'Home'
    url = '/'
    weight = 1

  [[menu.main]]
    name = 'About'
    url = '/about/'
    weight = 2

  [[menu.main]]
    name = 'Blog'
    url = '/blog/'
    weight = 3

  [[menu.sidebar]]
    name = 'About Me'
    url = '/about/'
    weight = 1

  [[menu.sidebar]]
    name = 'Blog Posts'
    url = '/blog/'
    weight = 2

  [[menu.footer]]
    name = 'About'
    url = '/about/'
    weight = 1

  [[menu.footer]]
    name = 'Blog'
    url = '/blog/'
    weight = 2

[caches]
  [caches.images]
    dir = ':cacheDir/images'

