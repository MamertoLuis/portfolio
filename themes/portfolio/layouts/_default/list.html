{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ with .Content }}<div>{{ . }}</div>{{ end }}
  <ul class="post-list">
    {{ range .Pages.ByPublishDate.Reverse }}
      <li>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        <div class="post-meta">{{ .PublishDate.Format "January 2, 2006" }}</div>
        {{ with .Summary }}<div class="post-summary">{{ . }}</div>{{ end }}
      </li>
    {{ end }}
  </ul>
{{ end }}
